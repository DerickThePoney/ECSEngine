# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
        with:
          lfs: true
          submodules: true

      #- run: git submodule update --init --recursive
      
      - name: setup-msbuild
        uses: microsoft/setup-msbuild@v1.0.1

      - name: build engine solution
        run: tools/premake5.exe vs2019
        shell: bash

      - name: build bgfx
        run: cd External/BGFX/bgfx && pwd && ../bx/tools/bin/windows/genie.exe --with-windows=10.0 vs2019 && msbuild.exe -m .build/projects/vs2019/bgfx.sln /property:Configuration=Release /property:Platform=x64
        shell: bash

      - name: Build engine
        run: msbuild.exe -m build/ECSEngine.sln /p:Configuration="Release"



      #- name: build solution
      #  run: msbuild.exe -m build/ECSEngine.sln
